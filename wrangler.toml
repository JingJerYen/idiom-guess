# Cloudflare Workers deployment. Secrets are NOT set here:
#   npx wrangler secret put GAME_ANTHROPIC_KEY
#   npx wrangler secret put GAME_OPENAI_KEY      (optional: Whisper + TTS)
# Build the frontend first (npm run build:web), then `npx wrangler deploy`.
name = "idiom-guess"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# Only the API goes through the worker; every other path is served straight from static assets.
run_worker_first = ["/api/*"]

[observability]
enabled = true

[vars]
# Non-secret settings (see .env.example). Uncomment to override defaults.
# MAX_GUESSES = "3"
# FINAL_GUESS_EFFORT = "medium"
# TTS_VOICE = "nova"
